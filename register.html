<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 제품 등록 - Olive Young Price Tracker</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <div class="header-inner">
            <div class="logo">
                <a href="index.html">
                    <span class="logo-badge">OY</span>
                    <span class="logo-text">올리브영 가격 추적기</span>
                </a>
            </div>
            <nav>
                <a href="index.html" class="nav-link">가격 대시보드</a>
                <a href="register.html" class="nav-link active">새 제품 등록</a>
            </nav>
        </div>
    </header>

    <main class="register-container">
        <div class="register-card">
            <div class="register-header">
                <span class="register-icon">✨</span>
                <h2>새 제품 즉시 추적 등록</h2>
                <p class="register-desc">올리브영 상품 링크를 입력하면 실시간으로 상품명과 현재 가격을 수집하여 등록 즉시 당일 가격 추적과 단위가격(10ml당/개당) 비교를 시작합니다.</p>
            </div>

            <form id="register-form">
                <div class="form-group">
                    <label for="product-url">올리브영 상품 URL <span class="required">*</span></label>
                    <div class="input-with-button">
                        <input type="url" id="product-url" name="product-url" placeholder="https://www.oliveyoung.co.kr/store/goods/getGoodsDetail.do?goodsNo=..." required autocomplete="off">
                        <button type="button" id="btn-fetch-info" class="btn-secondary">🔍 정보 조회</button>
                    </div>
                    <span class="input-hint">올리브영 상품 페이지 URL을 붙여넣으세요. (예: goodsNo=A000000...)</span>
                </div>

                <div id="product-preview-section" class="product-preview-section" style="display: none;">
                    <div class="form-group">
                        <label for="product-name">제품명</label>
                        <input type="text" id="product-name" name="product-name" placeholder="올리브영 제품명" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group flex-1">
                            <label for="product-price">현재 가격 (원) <span class="required">*</span></label>
                            <input type="number" id="product-price" name="product-price" placeholder="예: 27900" required>
                        </div>
                        <div class="form-group flex-1" id="preview-unit-price-box" style="display:none;">
                            <label>계산된 단위 가격</label>
                            <div class="preview-unit-price-val" id="preview-unit-price-val">-</div>
                        </div>
                    </div>
                </div>

                <button type="submit" id="btn-submit-register" class="btn-primary">⚡ 등록하고 즉시 트래킹 시작</button>
            </form>

            <div id="message" class="register-message" style="display: none;"></div>
        </div>
    </main>

    <footer>
        <p>© 2026 Olive Young Price Tracker • 실시간 올리브영 가격 및 가성비 비교</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
